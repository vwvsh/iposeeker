name: Daily Email Brief

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

jobs:
  send-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send daily email brief
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: vikinginshanghai@qq.com
        run: python scripts/send_daily_brief.py
