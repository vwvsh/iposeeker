name: Update IPO Feed

on:
  workflow_dispatch:
  schedule:
    - cron: "55 0 * * *"

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install data dependencies
        run: python -m pip install --upgrade akshare

      - name: Generate IPO feed
        run: python scripts/update_ipo_feed.py

      - name: Commit updated feed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update IPO feed"
          file_pattern: data/ipo-feed.json

      - name: Send daily email brief
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: vikinginshanghai@qq.com
        run: python scripts/send_daily_brief.py
